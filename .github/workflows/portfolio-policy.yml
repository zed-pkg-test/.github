name: Portfolio policy
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reject common committed secret material
        run: |
          set -euo pipefail
          ! grep -RInE 'ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|Authorization: Bearer [A-Za-z0-9._-]+' . --exclude-dir=.git
