name: DEN-2839 cache poll-guard verifier

on:
  pull_request:
    paths:
      - ".github/workflows/den-2839-cache-poll-guard-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-2839-cache-poll-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: ORESoftware/k8s-libs-and-shared-defs
      SOURCE_SHA: 2498e7f6937b9d495dfae1bcfe15ff409bd5863d
    steps:
      - name: Check out exact public source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable source identity and patch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test -f candidate/.github/den-2839-authoritative-poll-guard.py
          test -f candidate/ores-read-cache/src/lib.rs
          ! grep -R -E 'ghp_|lin_api_|cfat_|Secret Access Key' candidate/.github/den-2839-authoritative-poll-guard.py

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup default 1.85.1

      - name: Apply reviewed concurrency transformation
        working-directory: candidate
        run: python3 .github/den-2839-authoritative-poll-guard.py

      - name: Format, test, lint, and inspect transformed contract
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ores-read-cache/Cargo.toml
          cargo test --manifest-path ores-read-cache/Cargo.toml --all-targets
          cargo clippy --manifest-path ores-read-cache/Cargo.toml --all-targets -- -D warnings
          git diff --check
          grep -F 'RetryAuthoritativePoll' ores-read-cache/src/lib.rs
          grep -F 'try_begin_authoritative_poll' ores-read-cache/src/lib.rs
          grep -F 'an_older_poll_response_cannot_overwrite_a_newer_notification' ores-read-cache/src/lib.rs
          ! grep -F 'ObservationSource::AuthoritativePoll' ores-read-cache/src/lib.rs

      - name: Package bounded review evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/den-2839-cache-poll-guard"
          mkdir -p "$evidence"
          git -C candidate diff -- ores-read-cache/src/lib.rs \
            ores-read-cache/README.md docs/read-cache-contract.md > "$evidence/materialized.patch"
          git -C candidate diff --stat > "$evidence/diff-stat.txt"
          git -C candidate diff --check > "$evidence/diff-check.txt"
          printf 'source_repository=%s\nsource_sha=%s\nactual_sha=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$(git -C candidate rev-parse HEAD)" \
            > "$evidence/source.txt"

      - name: Upload bounded evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2839-cache-poll-guard-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/den-2839-cache-poll-guard
          retention-days: 2
          if-no-files-found: error
