name: Zed clients polyglot SDK matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '5 4 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@df3eed96202810b7e7d6667fabc3041b19e6a22f
    with:
      clients_repository: zed-pkg/zed-clients
      clients_ref: main
      clients_root: clients
      interfaces_repository: zed-pkg/zed-interfaces
      interfaces_ref: main
      interfaces_path: zed-interfaces
      interfaces_dependency: zed-pkg/zed-interfaces
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
