name: Zed clients polyglot SDK matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '5 4 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

env:
  SCHEDULE_TIMEZONE: Etc/UTC
  RUN_EVIDENCE_SCHEMA: zed-pkg-test.scheduled-run-evidence.v1
  MISSED_RUN_POLICY: fail-closed-no-valid-evidence-means-missed
  ZED_CLIENTS_CANDIDATE_SHA: 3196895c35412ee608750a8db830dbe83ec6a14c

concurrency:
  group: zed-clients-polyglot-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@e9505caaa5163eac18d0fffe20ef60cb071c7233
    with:
      clients_repository: zed-pkg/zed-clients
      clients_ref: 3196895c35412ee608750a8db830dbe83ec6a14c
      clients_root: clients
      disabled_languages: kotlin
      interfaces_repository: zed-pkg/zed-interfaces
      interfaces_ref: main
      interfaces_path: zed-interfaces
      interfaces_dependency: zed-pkg/zed-interfaces
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}

  kotlin-maven:
    name: kotlin Maven consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact zed-clients candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-clients
          ref: ${{ env.ZED_CLIENTS_CANDIDATE_SHA }}
          path: zed-clients
          token: ${{ secrets.TEST_ORG_READ_TOKEN || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate and Maven contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-clients rev-parse HEAD)" = "$ZED_CLIENTS_CANDIDATE_SHA"
          test -f zed-clients/clients/kotlin/pom.xml
          command -v mvn >/dev/null

      - name: Build and test the Kotlin SDK with its native toolchain
        shell: bash
        run: |
          set -euo pipefail
          mvn --version
          mvn -B -f zed-clients/clients/kotlin/pom.xml test

      - name: Record exact-head Kotlin evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kotlin-maven
          printf 'repository=zed-pkg/zed-clients\nrequested_sha=%s\nactual_sha=%s\nbuild_contract=clients/kotlin/pom.xml\n' \
            "$ZED_CLIENTS_CANDIDATE_SHA" \
            "$(git -C zed-clients rev-parse HEAD)" \
            > artifacts/kotlin-maven/source.txt
          mvn --version > artifacts/kotlin-maven/maven-version.txt

      - name: Publish Kotlin exact-head evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-clients-kotlin-maven-${{ env.ZED_CLIENTS_CANDIDATE_SHA }}
          path: artifacts/kotlin-maven/
          if-no-files-found: error
          retention-days: 30
