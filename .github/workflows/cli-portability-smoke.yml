name: reusable CLI portability smoke

on:
  pull_request:
    paths:
      - '.github/workflows/cli-portability-smoke.yml'
      - 'fixtures/rust-cli/**'
      - 'fixtures/node-cli/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-portability-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-cli:
    uses: ORESoftware/.github/.github/workflows/reusable-cli-portability.yml@34ba10889a77bed4ca8b7dc87ed08d559ae011b5
    with:
      language: rust
      working-directory: fixtures/rust-cli
      rust-toolchain: stable
      cargo-locked: true
      run-smoke: true

  node-cli:
    uses: ORESoftware/.github/.github/workflows/reusable-cli-portability.yml@34ba10889a77bed4ca8b7dc87ed08d559ae011b5
    with:
      language: node
      working-directory: fixtures/node-cli
      node-version: '22'
      node-package-manager: npm
      run-smoke: true
