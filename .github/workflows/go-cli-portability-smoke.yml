name: reusable Go CLI portability smoke

on:
  pull_request:
    paths:
      - '.github/workflows/go-cli-portability-smoke.yml'
      - 'fixtures/go-cli/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-cli:
    uses: ORESoftware/.github/.github/workflows/reusable-go-cli-portability.yml@ac77dc43ccda86797bf7b41901125d799d1dff40
    with:
      working-directory: fixtures/go-cli
      main-package: .
      run-smoke: true
