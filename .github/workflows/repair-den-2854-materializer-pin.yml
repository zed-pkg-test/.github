name: repair DEN-2854 materializer pin

on:
  push:
    branches:
      - alexanderdmills/den-2854-registry-materializer

permissions:
  contents: write

concurrency:
  group: repair-den-2854-materializer-pin
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pin-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-2854-registry-materializer
          persist-credentials: true
          show-progress: false

      - name: Pin both materializer jobs to the repaired production head
        shell: python
        run: |
          from pathlib import Path

          old = "773238bccb2dc255fd0b1420bbaa5e4a654c4963"
          new = "73e9070c86ff1dcf68134885d1b05be08a314839"
          path = Path(".github/workflows/public-rust-exact-sha.yml")
          source = path.read_text(encoding="utf-8")
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale materializer pin, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Verify workflow syntax boundary
        shell: python
        run: |
          from pathlib import Path
          source = Path(".github/workflows/public-rust-exact-sha.yml").read_text()
          assert "773238bccb2dc255fd0b1420bbaa5e4a654c4963" not in source
          assert source.count("73e9070c86ff1dcf68134885d1b05be08a314839") == 1

      - name: Commit repair and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-den-2854-materializer-pin.yml
          git config user.name "zed-pkg-test materializer bot"
          git config user.email "zed-pkg-test-materializer-bot@users.noreply.github.com"
          git add .github/workflows/public-rust-exact-sha.yml \
            .github/workflows/repair-den-2854-materializer-pin.yml
          git commit -m "pin both DEN-2854 materializers to repaired head [pin-repair]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
