name: Reusable polyglot SDK consumer matrix

on:
  workflow_call:
    inputs:
      clients_repository:
        description: Upstream owner/repository containing the SDK matrix
        required: true
        type: string
      clients_ref:
        description: Upstream branch, tag, or commit to test
        required: false
        default: main
        type: string
      clients_root:
        description: Directory containing the language SDK folders
        required: false
        default: clients
        type: string
      disabled_languages:
        description: Comma-separated matrix IDs intentionally absent from this client repository
        required: false
        default: ''
        type: string
      interfaces_repository:
        description: Optional sibling interfaces repository needed by local SDK builds
        required: false
        default: ''
        type: string
      interfaces_ref:
        description: Interfaces repository branch, tag, or commit
        required: false
        default: main
        type: string
      interfaces_path:
        description: Workspace-relative checkout path expected by local SDK dependencies
        required: false
        default: interfaces
        type: string
      interfaces_dependency:
        description: Expected Zed dependency coordinate; defaults to interfaces_repository
        required: false
        default: ''
        type: string
      lib_repository:
        description: Optional sibling library repository needed by local SDK builds
        required: false
        default: ''
        type: string
      lib_ref:
        description: Library repository branch, tag, or commit
        required: false
        default: main
        type: string
      lib_path:
        description: Workspace-relative checkout path expected by local SDK dependencies
        required: false
        default: lib
        type: string
      lib_dependency:
        description: Expected Zed dependency coordinate; defaults to lib_repository
        required: false
        default: ''
        type: string
    secrets:
      read_token:
        description: Fine-grained token or GitHub App token with read access to private upstream repositories
        required: false

permissions:
  contents: read

jobs:
  zed-package-contract:
    name: Zed package dependency contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the clients package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.clients_repository }}
          ref: ${{ inputs.clients_ref }}
          path: _contract
          token: ${{ secrets.read_token != '' && secrets.read_token || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Validate the clients Zed manifest
        shell: bash
        env:
          INTERFACES_REPOSITORY: ${{ inputs.interfaces_repository }}
          INTERFACES_DEPENDENCY: ${{ inputs.interfaces_dependency }}
          LIB_REPOSITORY: ${{ inputs.lib_repository }}
          LIB_DEPENDENCY: ${{ inputs.lib_dependency }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          manifest = pathlib.Path('_contract/.zpkg.toml')
          if not manifest.is_file():
              raise SystemExit('missing required root .zpkg.toml in clients repository')

          with manifest.open('rb') as stream:
              document = tomllib.load(stream)

          package = document.get('package', {})
          package_name = package.get('name')
          if not isinstance(package_name, str) or not package_name.endswith('-clients'):
              raise SystemExit(f"Zed package name must end in '-clients'; found {package_name!r}")

          dependencies = document.get('dependencies', {})
          if not isinstance(dependencies, dict):
              raise SystemExit('[dependencies] must be a TOML table')

          checks = (
              ('interfaces', os.environ['INTERFACES_REPOSITORY'], os.environ['INTERFACES_DEPENDENCY']),
              ('lib', os.environ['LIB_REPOSITORY'], os.environ['LIB_DEPENDENCY']),
          )
          for label, repository, explicit_coordinate in checks:
              if not repository:
                  continue
              coordinate = explicit_coordinate or repository
              if coordinate not in dependencies:
                  raise SystemExit(
                      f"missing required {label} Zed dependency {coordinate!r}; "
                      f"declared dependencies: {sorted(dependencies)}"
                  )

          print(f"validated {package_name} with {len(dependencies)} Zed dependencies")
          PY

  sdk-language:
    name: ${{ matrix.id }} consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gleamlang
            paths: gleam,gleamlang
            image: ghcr.io/gleam-lang/gleam:v1.15.2-elixir
            command: >-
              if [ -x ./test.sh ]; then ./test.sh; else
              if [ -f ../../syncer.c/bindings/beam/mix.exs ]; then
              (cd ../../syncer.c/bindings/beam &&
              mix local.hex --force &&
              mix local.rebar --force &&
              mix deps.get &&
              mix compile) &&
              export OPTO_SYNC_BEAM_EBIN="$(realpath ../../syncer.c/bindings/beam/_build/dev/lib/opto_sync_nif/ebin)" &&
              export OPTO_SYNC_ELIXIR_EBIN="$(elixir -e 'IO.puts(Path.join(:code.lib_dir(:elixir), "ebin"))')";
              fi &&
              gleam deps download &&
              gleam check &&
              gleam test; fi
          - id: erlang
            paths: erlang
            image: erlang:27
            command: >-
              if [ -x ./rebar3 ]; then ./rebar3 compile && ./rebar3 eunit;
              elif command -v rebar3 >/dev/null 2>&1; then rebar3 compile && rebar3 eunit;
              else find . -name '*.erl' -print0 | xargs -0 -r erlc -Werror; fi
          - id: elixir
            paths: elixir
            image: elixir:1.18
            command: >-
              test -f mix.exs &&
              mix local.hex --force &&
              mix local.rebar --force &&
              mix deps.get &&
              mix compile --warnings-as-errors &&
              mix test
          - id: dart
            paths: dart
            image: dart:stable
            command: >-
              if [ -x ./test.sh ]; then ./test.sh; else
              if [ -f ../../syncer.c/core/CMakeLists.txt ]; then
              apt-get update >/dev/null &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake libsqlite3-0 >/dev/null &&
              cmake -S ../../syncer.c/core -B ../../syncer.c/core/build &&
              cmake --build ../../syncer.c/core/build --target syncer &&
              export SYNCER_LIB_PATH="$(realpath ../../syncer.c/core/build/libsyncer.so)";
              fi &&
              test -f pubspec.yaml &&
              dart pub get &&
              dart analyze &&
              if [ -d test ]; then dart test; fi; fi
          - id: rust
            paths: rust
            image: rust:1
            command: >-
              test -f Cargo.toml &&
              cargo test --workspace --all-targets --all-features
          - id: java
            paths: java
            image: maven:3.9-eclipse-temurin-17
            command: >-
              if [ -x ./test.sh ]; then ./test.sh;
              elif [ -x ./mvnw ]; then ./mvnw -B test;
              elif [ -f pom.xml ]; then mvn -B test;
              elif [ -x ./gradlew ]; then ./gradlew --no-daemon test;
              elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then echo 'Java SDK requires test.sh or a Gradle wrapper' >&2; exit 1;
              else find . -name '*.java' -print0 | xargs -0 -r javac -Werror; fi
          - id: golang
            paths: go,golang
            image: golang:1
            command: >-
              test -f go.mod &&
              go test ./...
          - id: python3
            paths: python3,python
            image: python:3
            command: >-
              python -m venv /tmp/sdk-venv &&
              . /tmp/sdk-venv/bin/activate &&
              python -m pip install --disable-pip-version-check --upgrade pip &&
              if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi &&
              if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
                python -m pip install -e '.[test]' || python -m pip install -e .;
              fi &&
              python -m compileall -q . &&
              if [ -d tests ] || [ -d test ]; then python -m pip install pytest && python -m pytest -q; fi
          - id: ruby
            paths: ruby
            image: ruby:3
            command: >-
              if [ -f Gemfile ]; then bundle install; fi &&
              if [ -f Rakefile ]; then bundle exec rake test;
              else find . -name '*.rb' -print0 | xargs -0 -r -n1 ruby -c; fi
          - id: php
            paths: php
            image: composer:2
            command: >-
              test -f composer.json &&
              composer install --no-interaction --prefer-dist &&
              find . -name '*.php' -print0 | xargs -0 -r -n1 php -l &&
              if composer run-script --list --no-interaction 2>/dev/null | grep -Eq '(^|[[:space:]])test([[:space:]]|$)'; then composer test --no-interaction; fi
          - id: typescript-nodejs
            paths: typescript/nodejs,typescript/node,typescript
            image: node:22
            command: >-
              test -f package.json &&
              (corepack enable >/dev/null 2>&1 || true) &&
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile;
              elif [ -f yarn.lock ]; then yarn install --immutable;
              else npm ci || npm install; fi &&
              npm run typecheck --if-present &&
              npm run build --if-present &&
              npm run test --if-present
          - id: typescript-deno
            paths: typescript/deno,typescript/runtimes/deno,deno
            image: denoland/deno:2.9.5
            command: >-
              find . \( -name '*.ts' -o -name '*.tsx' \) | grep -q . &&
              find . \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 deno check &&
              deno test -A
          - id: typescript-bun
            paths: typescript/bun,typescript/runtimes/bun,bun
            image: oven/bun:1-debian
            command: >-
              test -f package.json &&
              (bun install --frozen-lockfile || bun install) &&
              if bun -e "const p=require('./package.json');process.exit(p.scripts?.typecheck?0:1)"; then bun run typecheck; fi &&
              if bun -e "const p=require('./package.json');process.exit(p.scripts?.build?0:1)"; then bun run build; fi &&
              if find . -type f \( -name '*test.ts' -o -name '*.test.ts' -o -name '*spec.ts' \) | grep -q .; then bun test; fi
          - id: typescript-edge
            paths: typescript/edge,typescript/runtimes/edge,typescript/edge-runtimes,edge
            image: node:22
            command: >-
              test -f package.json &&
              (npm ci || npm install) &&
              npm run typecheck --if-present &&
              npm run build --if-present &&
              npm run test:edge --if-present
          - id: kotlin
            paths: kotlin
            image: gradle:8-jdk17
            command: >-
              if [ -x ./gradlew ]; then
                if ./gradlew tasks --all | grep -q testDebugUnitTest; then ./gradlew --no-daemon testDebugUnitTest; else ./gradlew --no-daemon test; fi;
              elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then gradle --no-daemon test;
              else echo 'Kotlin SDK is missing its Gradle build contract' >&2; exit 1; fi
          - id: swift
            paths: swift
            image: swift:6.3.3-noble
            command: >-
              test -f Package.swift &&
              swift package resolve &&
              swift build &&
              if [ -d Tests ]; then swift test; fi
          - id: zig
            paths: zig
            command: >-
              test -f build.zig &&
              zig build test
          - id: cpp
            paths: cpp,cplusplus,cxx
            image: gcc:14
            command: >-
              apt-get update >/dev/null &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build >/dev/null &&
              test -f CMakeLists.txt &&
              cmake -S . -B /tmp/sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
              cmake --build /tmp/sdk-build &&
              ctest --test-dir /tmp/sdk-build --output-on-failure

    steps:
      - name: Check out the test harness without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate optional dependency checkout paths
        shell: bash
        env:
          INTERFACES_REPOSITORY: ${{ inputs.interfaces_repository }}
          INTERFACES_PATH: ${{ inputs.interfaces_path }}
          LIB_REPOSITORY: ${{ inputs.lib_repository }}
          LIB_PATH: ${{ inputs.lib_path }}
        run: |
          set -euo pipefail
          validate_path() {
            local label="$1"
            local repository="$2"
            local path="$3"
            [[ -z "$repository" ]] && return 0
            [[ "$path" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || {
              echo "$label checkout path contains unsupported characters: $path" >&2
              exit 1
            }
            [[ "$path" != /* && "$path" != _upstream && "$path" != _contract ]] || {
              echo "$label checkout path is reserved or absolute: $path" >&2
              exit 1
            }
            IFS='/' read -r -a parts <<< "$path"
            for part in "${parts[@]}"; do
              [[ "$part" != . && "$part" != .. && -n "$part" ]] || {
                echo "$label checkout path contains an unsafe segment: $path" >&2
                exit 1
              }
            done
          }
          validate_path interfaces "$INTERFACES_REPOSITORY" "$INTERFACES_PATH"
          validate_path lib "$LIB_REPOSITORY" "$LIB_PATH"

      - name: Check out the upstream clients repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.clients_repository }}
          ref: ${{ inputs.clients_ref }}
          path: _upstream
          token: ${{ secrets.read_token != '' && secrets.read_token || github.token }}
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Check out the interfaces dependency
        if: ${{ inputs.interfaces_repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.interfaces_repository }}
          ref: ${{ inputs.interfaces_ref }}
          path: ${{ inputs.interfaces_path }}
          token: ${{ secrets.read_token != '' && secrets.read_token || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Check out the library dependency
        if: ${{ inputs.lib_repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.lib_repository }}
          ref: ${{ inputs.lib_ref }}
          path: ${{ inputs.lib_path }}
          token: ${{ secrets.read_token != '' && secrets.read_token || github.token }}
          persist-credentials: false
          show-progress: false

      - name: Select supported language consumers
        id: language-selection
        shell: bash
        env:
          DISABLED_LANGUAGES: ${{ inputs.disabled_languages }}
          LANGUAGE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          disabled=",${DISABLED_LANGUAGES//[[:space:]]/},"
          if [[ "$disabled" == *",${LANGUAGE_ID},"* ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping intentionally absent $LANGUAGE_ID SDK"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve and enforce the language SDK directory
        if: ${{ steps.language-selection.outputs.enabled == 'true' }}
        id: sdk-root
        shell: bash
        env:
          CLIENTS_ROOT: ${{ inputs.clients_root }}
          LANGUAGE_PATHS: ${{ matrix.paths }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a candidates <<< "$LANGUAGE_PATHS"
          for candidate in "${candidates[@]}"; do
            root="_upstream/${CLIENTS_ROOT%/}/${candidate}"
            if [[ -d "$root" ]]; then
              resolved="$(realpath -m "$root")"
              workspace="$(realpath -m "$GITHUB_WORKSPACE")"
              [[ "$resolved" == "$workspace"/* ]] || {
                echo "Resolved SDK path escapes the workspace: $resolved" >&2
                exit 1
              }
              echo "root=$root" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Missing required ${{ matrix.id }} SDK beneath ${CLIENTS_ROOT}. Expected one of: ${LANGUAGE_PATHS}" >&2
          find "_upstream/${CLIENTS_ROOT%/}" -maxdepth 3 -mindepth 1 -type d -print 2>/dev/null | sort >&2 || true
          exit 1

      - name: Set up the pinned Zig toolchain
        if: ${{ steps.language-selection.outputs.enabled == 'true' && matrix.id == 'zig' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Compile and test the SDK in its native toolchain
        if: ${{ steps.language-selection.outputs.enabled == 'true' }}
        shell: bash
        env:
          LANGUAGE_ID: ${{ matrix.id }}
          SDK_IMAGE: ${{ matrix.image }}
          SDK_COMMAND: ${{ matrix.command }}
          SDK_ROOT: ${{ steps.sdk-root.outputs.root }}
        run: |
          set -euo pipefail
          if [[ "$LANGUAGE_ID" == "zig" ]]; then
            cd "$SDK_ROOT"
            sh -c "set -eu; $SDK_COMMAND"
            exit 0
          fi

          runtime_image="$SDK_IMAGE"
          beam_dockerfile="_upstream/syncer.c/bindings/beam/Dockerfile.test"
          if [[ "$LANGUAGE_ID" == "gleamlang" && -f "$beam_dockerfile" ]]; then
            case "$(uname -m)" in
              x86_64) target_arch="amd64" ;;
              aarch64|arm64) target_arch="arm64" ;;
              *)
                echo "Unsupported runner architecture for the BEAM test image: $(uname -m)" >&2
                exit 1
                ;;
            esac
            runtime_image="opto-sync-beam-test:local"
            docker build \
              --build-arg "TARGETARCH=$target_arch" \
              --file "$beam_dockerfile" \
              --tag "$runtime_image" \
              "$(dirname "$beam_dockerfile")"
          else
            docker pull "$runtime_image"
          fi
          docker run --rm \
            --entrypoint sh \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir "/workspace/$SDK_ROOT" \
            "$runtime_image" \
            -c "set -eu; $SDK_COMMAND"
