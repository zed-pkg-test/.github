name: proof ores-reactive-maps 4cc5e4c

on:
  pull_request:
    paths:
      - '.github/workflows/proof-ores-reactive-maps-4cc5e4c.yml'

permissions:
  contents: read

env:
  SUBJECT_REPOSITORY: ORESoftware/ores-reactive-maps
  SUBJECT_SHA: 4cc5e4c2c8edda6ef2173be7f2929ed23d3308f4

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subject/src/typescript/package-lock.json
      - run: npm install --ignore-scripts
        working-directory: subject/src/typescript
      - run: npm test
        working-directory: subject/src/typescript
      - run: npm run build
        working-directory: subject/src/typescript

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: subject/src/go/go.mod
      - run: go test -race ./...
        working-directory: subject/src/go

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        working-directory: subject/src/rust

  gleam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          gleam-version: '1.15.4'
          rebar3-version: '3'
      - run: gleam test
        working-directory: subject/src/gleam
