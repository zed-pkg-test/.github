name: Reusable polyglot SDK consumer matrix

on:
  workflow_call:
    inputs:
      clients_repository:
        description: Upstream owner/repository containing the SDK matrix
        required: true
        type: string
      clients_ref:
        description: Upstream branch, tag, or commit to test
        required: false
        default: main
        type: string
      clients_root:
        description: Directory containing the language SDK folders
        required: false
        default: clients
        type: string
    secrets:
      read_token:
        description: Fine-grained token or GitHub App token with read access to a private upstream repository
        required: false

permissions:
  contents: read

jobs:
  sdk-language:
    name: ${{ matrix.id }} consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gleamlang
            paths: gleam,gleamlang
            image: ghcr.io/gleam-lang/gleam:latest
            command: >-
              test -f gleam.toml &&
              gleam deps download &&
              gleam check &&
              gleam test
          - id: erlang
            paths: erlang
            image: erlang:27
            command: >-
              if [ -x ./rebar3 ]; then ./rebar3 compile && ./rebar3 eunit;
              elif command -v rebar3 >/dev/null 2>&1; then rebar3 compile && rebar3 eunit;
              else find . -name '*.erl' -print0 | xargs -0 -r erlc -Werror; fi
          - id: elixir
            paths: elixir
            image: elixir:1.18
            command: >-
              test -f mix.exs &&
              mix local.hex --force &&
              mix local.rebar --force &&
              mix deps.get &&
              mix compile --warnings-as-errors &&
              mix test
          - id: dart
            paths: dart
            image: dart:stable
            command: >-
              test -f pubspec.yaml &&
              dart pub get &&
              dart analyze &&
              if [ -d test ]; then dart test; fi
          - id: rust
            paths: rust
            image: rust:1
            command: >-
              test -f Cargo.toml &&
              cargo test --workspace --all-targets --all-features
          - id: java
            paths: java
            image: maven:3.9-eclipse-temurin-21
            command: >-
              if [ -x ./mvnw ]; then ./mvnw -B test;
              elif [ -f pom.xml ]; then mvn -B test;
              elif [ -x ./gradlew ]; then ./gradlew --no-daemon test;
              elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then echo 'Java SDK requires a Gradle wrapper' >&2; exit 1;
              else find . -name '*.java' -print0 | xargs -0 -r javac -Werror; fi
          - id: golang
            paths: go,golang
            image: golang:1
            command: >-
              test -f go.mod &&
              go test ./...
          - id: python3
            paths: python3,python
            image: python:3
            command: >-
              python -m venv /tmp/sdk-venv &&
              . /tmp/sdk-venv/bin/activate &&
              python -m pip install --disable-pip-version-check --upgrade pip &&
              if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi &&
              if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
                python -m pip install -e '.[test]' || python -m pip install -e .;
              fi &&
              python -m compileall -q . &&
              if [ -d tests ] || [ -d test ]; then python -m pip install pytest && python -m pytest -q; fi
          - id: ruby
            paths: ruby
            image: ruby:3
            command: >-
              if [ -f Gemfile ]; then bundle install; fi &&
              if [ -f Rakefile ]; then bundle exec rake test;
              else find . -name '*.rb' -print0 | xargs -0 -r -n1 ruby -c; fi
          - id: php
            paths: php
            image: composer:2
            command: >-
              test -f composer.json &&
              composer install --no-interaction --prefer-dist &&
              find . -name '*.php' -print0 | xargs -0 -r -n1 php -l &&
              if composer run-script --list --no-interaction 2>/dev/null | grep -Eq '(^|[[:space:]])test([[:space:]]|$)'; then composer test --no-interaction; fi
          - id: typescript-nodejs
            paths: typescript/nodejs,typescript/node,typescript
            image: node:22
            command: >-
              test -f package.json;
              corepack enable >/dev/null 2>&1 || true;
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile && pnpm run typecheck --if-present && pnpm test --if-present && pnpm run build --if-present;
              elif [ -f yarn.lock ]; then yarn install --immutable && yarn run typecheck --if-present && yarn test --if-present && yarn run build --if-present;
              else (npm ci || npm install) && npm run typecheck --if-present && npm test --if-present && npm run build --if-present; fi
          - id: typescript-deno
            paths: typescript/deno,deno
            image: denoland/deno:2
            command: >-
              find . \( -name '*.ts' -o -name '*.tsx' \) | grep -q . &&
              find . \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 deno check &&
              deno test -A
          - id: typescript-bun
            paths: typescript/bun,bun
            image: oven/bun:1-debian
            command: >-
              test -f package.json &&
              (bun install --frozen-lockfile || bun install) &&
              if bun -e "const p=require('./package.json');process.exit(p.scripts?.typecheck?0:1)"; then bun run typecheck; fi &&
              if bun -e "const p=require('./package.json');process.exit(p.scripts?.build?0:1)"; then bun run build; fi &&
              if find . -type f \( -name '*test.ts' -o -name '*.test.ts' -o -name '*spec.ts' \) | grep -q .; then bun test; fi
          - id: typescript-edge
            paths: typescript/edge,typescript/edge-runtimes,edge
            image: node:22
            command: >-
              test -f package.json &&
              (npm ci || npm install) &&
              npm run typecheck --if-present &&
              npm run test:edge --if-present &&
              npm run build --if-present
          - id: kotlin
            paths: kotlin
            image: gradle:8-jdk21
            command: >-
              if [ -x ./gradlew ]; then
                if ./gradlew tasks --all | grep -q testDebugUnitTest; then ./gradlew --no-daemon testDebugUnitTest; else ./gradlew --no-daemon test; fi;
              elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then gradle --no-daemon test;
              else echo 'Kotlin SDK is missing its Gradle build contract' >&2; exit 1; fi
          - id: swift
            paths: swift
            image: swift:6
            command: >-
              test -f Package.swift &&
              swift package resolve &&
              swift test
          - id: zig
            paths: zig
            image: ziglang/zig:0.14.0
            command: >-
              test -f build.zig &&
              zig build test
          - id: cpp
            paths: cpp,cplusplus,cxx
            image: gcc:14
            command: >-
              apt-get update >/dev/null &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build >/dev/null &&
              test -f CMakeLists.txt &&
              cmake -S . -B /tmp/sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
              cmake --build /tmp/sdk-build &&
              ctest --test-dir /tmp/sdk-build --output-on-failure

    steps:
      - name: Check out the test harness without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out the upstream clients repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.clients_repository }}
          ref: ${{ inputs.clients_ref }}
          path: _upstream
          token: ${{ secrets.read_token != '' && secrets.read_token || github.token }}
          persist-credentials: false
          show-progress: false
          sparse-checkout: ${{ inputs.clients_root }}
          sparse-checkout-cone-mode: true

      - name: Resolve and enforce the language SDK directory
        id: sdk-root
        shell: bash
        env:
          CLIENTS_ROOT: ${{ inputs.clients_root }}
          LANGUAGE_PATHS: ${{ matrix.paths }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a candidates <<< "$LANGUAGE_PATHS"
          for candidate in "${candidates[@]}"; do
            root="_upstream/${CLIENTS_ROOT%/}/${candidate}"
            if [[ -d "$root" ]]; then
              resolved="$(realpath -m "$root")"
              workspace="$(realpath -m "$GITHUB_WORKSPACE")"
              [[ "$resolved" == "$workspace"/* ]] || {
                echo "Resolved SDK path escapes the workspace: $resolved" >&2
                exit 1
              }
              echo "root=$root" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Missing required ${{ matrix.id }} SDK beneath ${CLIENTS_ROOT}. Expected one of: ${LANGUAGE_PATHS}" >&2
          find "_upstream/${CLIENTS_ROOT%/}" -maxdepth 3 -mindepth 1 -type d -print 2>/dev/null | sort >&2 || true
          exit 1

      - name: Compile and test the SDK in its native toolchain
        shell: bash
        env:
          SDK_IMAGE: ${{ matrix.image }}
          SDK_COMMAND: ${{ matrix.command }}
          SDK_ROOT: ${{ steps.sdk-root.outputs.root }}
        run: |
          set -euo pipefail
          docker pull "$SDK_IMAGE"
          docker run --rm \
            --entrypoint sh \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir "/workspace/$SDK_ROOT" \
            "$SDK_IMAGE" \
            -c "$SDK_COMMAND"
